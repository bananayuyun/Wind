// 4×4 Mesh 基础配置（共享参数）
topology = mesh;
k = 4;
n = 2;

routing_function = dor;   // Dimension-Order Routing（等价于 XY 路由）

// 流控
num_vcs     = 4;
vc_buf_size = 8;           // 每 VC 8 flit，单路由器总容量 = 5端口×4VC×8 = 160 flits
wait_for_tail_credit = 0;

// 分配器
vc_allocator = islip;
sw_allocator = islip;
alloc_iters  = 1;

// 延迟
credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;

// 加速比
input_speedup  = 1;
output_speedup = 1;
internal_speedup = 1.0;

// 包大小：1 flit（便于缓冲区数据解读）
packet_size = 1;

// 仿真模式
sim_type = latency;

// 预热 + 采样
warmup_periods  = 3;
sample_period   = 1000;
max_samples     = 1;
sim_count       = 1;

// 不输出标准日志（减少噪音）
print_csv_results = 0;
